<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Santhica</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
:root{--bg:#fff;--surface:#f4f8fa;--line:#d8e4e9;--text:#142b43;--muted:#586c7c;--blue:#0c4a8e;--teal:#00876e;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:var(--bg);color:var(--text);font:16px/1.65 var(--font);-webkit-font-smoothing:antialiased}
main{max-width:520px;text-align:center}
.code{display:inline-block;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.08em}
h1{margin:20px 0 12px;font-size:clamp(26px,5vw,36px);line-height:1.2;letter-spacing:-.02em}
p{margin:0 auto 28px;max-width:42ch;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a{display:inline-block;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;transition:opacity .15s}
a:hover{opacity:.82}
.primary{background:var(--blue);color:#fff}
.secondary{border:1px solid var(--line);color:var(--text)}
</style>
</head>
<body>
<main>
<span class="code">404</span>
<h1>We couldn't find that page.</h1>
<p>The link may be out of date, or the page may have moved. Everything else is still where you left it.</p>
<div class="links">
<a class="primary" href="/">Go to the homepage</a>
<a class="secondary" href="/contact.html">Contact us</a>
</div>
</main>
</body>
</html>
